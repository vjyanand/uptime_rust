[package]
name = "uptime-check"
version = "0.1.3"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
chrono = { version = "0.4.42", features = ["serde"] }
memcache = { version = "0.21.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "gzip", "brotli", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.48.0", features = ["full"] }
env_logger = "0.11.8"
log = "0.4.34"
futures = "0.3.34"
rand = "0.10.3"
md5 = "0.8.0"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z" 
lto = true
codegen-units = 1
panic = "abort"
